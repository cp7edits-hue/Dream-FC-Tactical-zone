<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="pitchGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f2316"/>
      <stop offset="100%" stop-color="#070e18"/>
    </linearGradient>
    <linearGradient id="limeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#bef264"/>
      <stop offset="100%" stop-color="#84cc16"/>
    </linearGradient>
  </defs>
  
  <!-- Outer Rounded Shield -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#pitchGrad)" stroke="#1e293b" stroke-width="2"/>
  
  <!-- Pitch Markings -->
  <rect x="8" y="10" width="48" height="44" rx="4" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="3 2"/>
  <line x1="8" y1="32" x2="56" y2="32" stroke="#334155" stroke-width="1.5"/>
  <circle cx="32" cy="32" r="9" fill="none" stroke="#334155" stroke-width="1.5"/>
  <circle cx="32" cy="32" r="2" fill="#a3e635"/>
  
  <!-- Tactical Tokens (White Home & Navy Away) -->
  <circle cx="22" cy="42" r="4.5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <circle cx="42" cy="40" r="4.5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <circle cx="32" cy="22" r="4.5" fill="#1e3a8a" stroke="#38bdf8" stroke-width="1"/>
  
  <!-- Curved Tactical Arrow (Neon Lime) -->
  <path d="M 22 42 Q 28 28 32 23" fill="none" stroke="url(#limeGrad)" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="32,20 34,25 29,24" fill="#a3e635"/>
  
  <!-- Brand text badge -->
  <rect x="18" y="49" width="28" height="9" rx="3" fill="#020617" stroke="#a3e635" stroke-width="1"/>
  <text x="32" y="56" font-family="system-ui, sans-serif" font-weight="900" font-size="6.5" fill="#a3e635" text-anchor="middle" letter-spacing="0.5">DFC</text>
</svg>
